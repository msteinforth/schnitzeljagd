# Lokale Entwicklungsumgebung: PostgreSQL und S3-kompatibler Speicher (MinIO).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: schnitzeljagd
      POSTGRES_PASSWORD: schnitzeljagd
      POSTGRES_DB: schnitzeljagd
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schnitzeljagd"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: schnitzeljagd
      MINIO_ROOT_PASSWORD: schnitzeljagd-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 schnitzeljagd schnitzeljagd-secret; do sleep 1; done;
      mc mb --ignore-existing local/schnitzeljagd-media;
      mc anonymous set none local/schnitzeljagd-media;
      "

volumes:
  postgres-data:
  minio-data:
