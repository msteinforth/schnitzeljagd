name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schnitzeljagd
          POSTGRES_PASSWORD: schnitzeljagd
          POSTGRES_DB: schnitzeljagd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schnitzeljagd"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://schnitzeljagd:schnitzeljagd@localhost:5432/schnitzeljagd
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrationen gegen leere Datenbank anwenden
        run: pnpm db:migrate
      - run: pnpm build
